# Render Blueprint: ONE Docker web service (React build + FastAPI on the same domain).
# The MySQL database is EXTERNAL (e.g. Aiven) - Render does not create it.
services:
  - type: web
    name: voiceroute
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL        # paste your Aiven MySQL URL in the Render dashboard (never commit it)
        sync: false
      - key: JWT_SECRET_KEY      # generated by Render, >= 32 chars
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS        # same-origin deployment: leave empty
        value: ""
      - key: DATABASE_SSL_CA     # optional: Aiven CA certificate (PEM text) to verify the server
        sync: false
      - key: AUTO_BOOTSTRAP      # "true" once: creates tables/triggers/seed + admin, then set back to "false"
        value: "false"
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
